name: Read curriculum execution report
on:
  workflow_run:
    workflows: ['Chinese curriculum execution audit']
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Audit run ID; blank selects the latest run'
        required: false
  push:
    branches: [main]
    paths: ['.github/workflows/learning-report.yml']
permissions:
  actions: read
  contents: read
jobs:
  report:
    # Superseded audits are cancelled before producing a complete report.
    # Do not misreport missing cancellation artifacts as a curriculum failure.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Retrieve audit report and print errors
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_RUN: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: |
          audit_run="$REQUESTED_RUN"
          if [ -z "$audit_run" ]; then
            audit_run=$(gh api "repos/$GH_REPO/actions/workflows/chinese-learning.yml/runs?per_page=1" --jq '.workflow_runs[0].id')
          fi
          # A failed audit still has a diagnostic artifact; its status is preserved.
          gh run watch "$audit_run" --interval 30 || true
          gh run download "$audit_run" --name learning-execution-report --dir /tmp/learning-report
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('/tmp/learning-report')
          report = root / 'results.json'
          if not report.exists():
              report = root / 'notebooks.json'
          rows = json.loads(report.read_text())
          for row in rows:
              print(json.dumps({k: row[k] for k in ('path', 'category', 'status', 'executed_cells', 'cell_index', 'seconds', 'error') if k in row}, ensure_ascii=False))
          counts = {s: sum(x['status'] == s for x in rows) for s in sorted({x['status'] for x in rows})}
          print(json.dumps(counts))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Curriculum execution results\n\n')
              summary.write('Report file: ' + report.name + '\n\n')
              summary.write('| Status | Count |\n| --- | ---: |\n')
              for status, count in counts.items():
                  summary.write(f'| {status} | {count} |\n')
          PY
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            lessons
            etc/quiz-app/src/assets/translations
          persist-credentials: false
      - name: Inspect source of failed notebooks without historical outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for row in json.loads(Path('/tmp/learning-report/results.json').read_text()):
              if row['status'] != 'failed' or not row['path'].endswith('.ipynb'):
                  continue
              notebook = json.loads(Path(row['path']).read_text())
              for cell in notebook['cells']:
                  if cell['cell_type'] == 'code':
                      cell['outputs'] = []
                      cell['execution_count'] = None
              print('NOTEBOOK_SOURCE ' + json.dumps({'path': row['path'], 'notebook': notebook}))
          for path in Path('lessons').rglob('*.py'):
              if path.name in ('tfcv.py', 'tfutil.py', 'torchcv.py', 'utils.py'):
                  print('HELPER_SOURCE ' + json.dumps({'path': str(path), 'content': path.read_text()}))
          path = Path('etc/quiz-app/src/assets/translations/index.js')
          print('QUIZ_TRANSLATION_EXISTS', path.exists())
          PY
