name: NLP compatibility smoke test
on:
  push:
    branches: [main]
    paths: ['lessons/5-NLP/**', '.github/workflows/nlp-smoke.yml']
  pull_request:
    paths: ['lessons/5-NLP/**', '.github/workflows/nlp-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first_training:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: lessons/5-NLP
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install tensorflow==2.17.0 keras==3.5.0 numpy==1.26.4 matplotlib==3.10.8 scipy==1.13.1 scikit-learn==1.8.0 ipython tensorflow-datasets==4.9.6 tensorflow-metadata==1.15.0 importlib_resources tensorflow-text==2.17.0 tensorflow-hub==0.16.1 tf-keras==2.17.0 transformers==4.44.2
      - name: Verify repaired input and shape paths with real data and two training batches
        env:
          OMP_NUM_THREADS: '1'
          TF_NUM_INTEROP_THREADS: '1'
          TF_NUM_INTRAOP_THREADS: '1'
          MPLBACKEND: Agg
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from IPython.terminal.interactiveshell import TerminalInteractiveShell
          import tensorflow as tf
          import tf_keras as legacy_keras
          original_fit=tf.keras.Model.fit
          legacy_fit=legacy_keras.Model.fit
          calls=[]
          def limited_fit(self,x,*args,**kwargs):
              if isinstance(x,tf.data.Dataset):x=x.take(2)
              if isinstance(kwargs.get('validation_data'),tf.data.Dataset):
                  kwargs['validation_data']=kwargs['validation_data'].take(1)
              kwargs['epochs']=1
              if 'steps_per_epoch' in kwargs:kwargs['steps_per_epoch']=2
              if 'validation_steps' in kwargs:kwargs['validation_steps']=1
              chosen_fit=legacy_fit if isinstance(self,legacy_keras.Model) else original_fit
              result=chosen_fit(self,x,*args,**kwargs)
              assert all(tf.math.is_finite(v) for v in result.history['loss'])
              calls.append(self.name)
              return result
          tf.keras.Model.fit=limited_fit
          legacy_keras.Model.fit=limited_fit
          specs={
              '13-TextRep/TextRepresentationTF.ipynb':None,
              '14-Embeddings/EmbeddingsTF.ipynb':5,
              '16-RNN/RNNTF.ipynb':9,
              '17-GenerativeNetworks/GenerativeTF.ipynb':13,
              '18-Transformers/TransformersTF.ipynb':None,
          }
          root=Path('lessons/5-NLP').resolve()
          for relative,last in specs.items():
              shell=TerminalInteractiveShell.instance()
              shell.reset(new_session=True)
              tf.keras.backend.clear_session()
              before=len(calls)
              path=root/relative;os.chdir(path.parent)
              for index,cell in enumerate(json.loads(path.read_text())['cells']):
                  if last is not None and index>last:break
                  if cell['cell_type']!='code':continue
                  result=shell.run_cell(''.join(cell['source']))
                  if result.error_before_exec:raise result.error_before_exec
                  if result.error_in_exec:raise result.error_in_exec
              assert len(calls)>before, 'No training executed: '+relative
              print('SMOKE_PASSED',relative,'training_calls',len(calls)-before,flush=True)
          print('Compatibility smoke tests only; full datasets, pretrained embeddings and complete training are not verified by this job.')
          PY
