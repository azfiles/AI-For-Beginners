name: Long notebook all-cell compatibility
on:
  push:
    paths: ['tools/test_long_notebooks.py', '.github/workflows/long-notebooks.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: long-notebooks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        lesson: [gan_torch, autoencoders_torch, conv_torch, conv_tf, transfer_torch, transfer_tf, style_tf, adversarial_tf, cbow_torch, cbow_tf, transformers_torch, generative_tf]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            lessons
            site
            tools
            data
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install torch==2.2.2 torchvision==0.17.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r site/requirements-advanced.txt
      - run: python tools/test_long_notebooks.py ${{ matrix.lesson }}
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          TF_NUM_INTEROP_THREADS: '1'
          TF_NUM_INTRAOP_THREADS: '1'
          MPLBACKEND: Agg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-${{ matrix.lesson }}
          path: compatibility-results/
          retention-days: 30
