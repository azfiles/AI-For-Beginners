name: Chinese curriculum execution audit
on:
  push:
    branches: [main]
    paths: ['tools/**', 'site/**', 'lessons/**', 'examples/**', '.github/workflows/chinese-learning.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chinese-learning-main
  cancel-in-progress: true
jobs:
  execution:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            lessons
            data
            examples
            tools
            site
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU framework and recorded core environment
        run: |
          python -m pip install torch==2.2.2 torchvision==0.17.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r site/requirements-learning.txt
          python -m pip install -c site/requirements-learning.txt tensorflow-datasets==4.9.6 tensorflow-metadata==1.15.0 tensorflow-hub==0.16.1 tf-keras==2.17.0 importlib_resources portalocker==2.10.1 gym==0.26.2 pygame==2.6.0 scikit-image==0.24.0 tifffile==2024.8.10 gensim==4.3.3 transformers==4.44.2
      - name: Execute all curriculum notebooks and beginner scripts
        run: python tools/validate_learning.py --workers 4 --timeout 120
      - name: Preserve execution results even when lessons fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-execution-report
          path: validation/
          if-no-files-found: warn
          retention-days: 30
