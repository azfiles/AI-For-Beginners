name: Chinese curriculum execution audit
on:
  push:
    branches: [main, codex/gan-compatibility]
    paths: ['tools/**', 'site/**', 'lessons/**', 'examples/**', '.github/workflows/chinese-learning.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chinese-learning-${{ github.ref }}
  cancel-in-progress: true
jobs:
  execution:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            lessons
            data
            examples
            tools
            site
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU framework and recorded core environment
        run: |
          python -m pip install torch==2.2.2 torchvision==0.17.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r site/requirements-learning.txt
          python -m pip install -r site/requirements-advanced.txt
      - name: Execute all curriculum notebooks and beginner scripts
        run: python tools/validate_learning.py --workers 4 --timeout 600
      - name: Preserve execution results even when lessons fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-execution-report
          path: validation/
          if-no-files-found: warn
          retention-days: 30
