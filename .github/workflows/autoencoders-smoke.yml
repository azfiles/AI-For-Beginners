name: Autoencoders all-cell smoke test
on:
  push:
    branches: [main]
    paths: ['lessons/4-ComputerVision/09-Autoencoders/AutoencodersTF.ipynb', '.github/workflows/autoencoders-smoke.yml']
  pull_request:
    paths: ['lessons/4-ComputerVision/09-Autoencoders/AutoencodersTF.ipynb', '.github/workflows/autoencoders-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  all_cells:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: lessons/4-ComputerVision/09-Autoencoders
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install tensorflow==2.17.0 keras==3.5.0 numpy==1.26.4 matplotlib==3.10.8
      - env:
          OMP_NUM_THREADS: '1'
          TF_NUM_INTEROP_THREADS: '1'
          TF_NUM_INTRAOP_THREADS: '1'
          MPLBACKEND: Agg
        run: |
          python - <<'PY'
          import json, numpy as np, tensorflow as tf
          from pathlib import Path
          fit = tf.keras.Model.fit
          histories=[]
          def limited_fit(self, x, y=None, **kwargs):
              kwargs['epochs']=1
              if 'validation_data' in kwargs:
                  kwargs['validation_data']=tuple(v[:128] for v in kwargs['validation_data'])
              history=fit(self,x[:128],y[:128],**kwargs)
              assert all(np.isfinite(v).all() for v in history.history.values())
              histories.append(history)
              return history
          tf.keras.Model.fit=limited_fit
          namespace={}
          path=Path('lessons/4-ComputerVision/09-Autoencoders/AutoencodersTF.ipynb')
          for i,cell in enumerate(json.loads(path.read_text())['cells']):
              if cell['cell_type']=='code':
                  exec(compile(''.join(cell['source']),str(path)+':'+str(i),'exec'),namespace)
          assert len(histories)==4
          assert tf.executing_eagerly()
          print('PASSED: all autoencoder cells; four training paths, 128 examples and one epoch each. Full training not tested.')
          PY
