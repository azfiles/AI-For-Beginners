name: Browser notebook execution
on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/browser-notebooks.yml', 'tools/test_browser_notebooks.py', 'lessons/2-Symbolic/**', 'lessons/3-NeuralNetworks/**', 'lessons/6-Other/21-GeneticAlgorithms/**']
  pull_request:
    paths: ['website/**', '.github/workflows/browser-notebooks.yml', 'tools/test_browser_notebooks.py', 'lessons/2-Symbolic/**', 'lessons/3-NeuralNetworks/**', 'lessons/6-Other/21-GeneticAlgorithms/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            website
            tools
            lessons
            data
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jupyterlite-core==0.7.0 jupyter-server==2.17.0 jupyterlite-pyodide-kernel==0.7.0 jupyterlab-language-pack-zh-CN ipywidgets playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m pip wheel --no-deps --wheel-dir website/wheels experta==1.9.4 frozendict==1.2 schema==0.6.7
      - run: python website/prepare_lite.py
      - run: jupyter lite build --lite-dir website/lite --contents lite-content --output-dir lite-dist
      - run: python tools/test_browser_notebooks.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-notebooks
          path: |
            lite-dist/
            browser-results.json
          retention-days: 14
