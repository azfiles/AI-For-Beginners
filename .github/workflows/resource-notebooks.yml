name: Resource notebook execution
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resources:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            lessons
            site
            tools
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install torch==2.2.2 torchvision==0.17.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tensorflow==2.17.0 keras==3.5.0 numpy==1.26.4 pandas==2.2.3 matplotlib==3.10.8 nbclient ipykernel
      - run: python tools/test_resource_notebooks.py
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          TF_NUM_INTEROP_THREADS: '1'
          TF_NUM_INTRAOP_THREADS: '1'
          MPLBACKEND: Agg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resource-notebook-results
          path: resource-notebook-results.json
