name: Build Chinese learning site
on:
  push:
    branches: [main]
    paths: ['README.md', 'CONTRIBUTING.md', 'NOTEBOOK_STATUS.zh-CN.md', 'docs/**', 'website/**', 'site-app/**', 'site/**', 'runtime/**', 'tools/check_repository_contract.py', 'lessons/**', 'examples/**', 'translations/zh-CN/**', '.github/workflows/chinese-site.yml']
  pull_request:
    paths: ['README.md', 'CONTRIBUTING.md', 'NOTEBOOK_STATUS.zh-CN.md', 'docs/**', 'website/**', 'site-app/**', 'site/**', 'runtime/**', 'tools/check_repository_contract.py', 'lessons/**', 'examples/**', 'translations/zh-CN/**', '.github/workflows/chinese-site.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            README.md
            CONTRIBUTING.md
            NOTEBOOK_STATUS.zh-CN.md
            docs
            website
            site
            site-app
            runtime
            tools
            lessons
            examples
            etc/quiz-app/src/assets/translations
            data
            images
            translated_images/zh-CN
            translations/zh-CN
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install static rendering dependencies
        run: |
          python -m pip install markdown==3.10.3 jupyterlite-core==0.7.0 jupyter-server==2.17.0 jupyterlite-pyodide-kernel==0.7.0 jupyterlab-language-pack-zh-CN ipywidgets
          npm install --prefix /tmp/course-math --ignore-scripts katex@0.16.22
          mkdir -p website/vendor/katex
          cp -R /tmp/course-math/node_modules/katex/dist/. website/vendor/katex/
          cp /tmp/course-math/node_modules/katex/LICENSE website/vendor/katex/LICENSE
      - name: Build browser notebook environment
        run: |
          python -m pip wheel --no-deps --wheel-dir website/wheels experta==1.9.4 frozendict==1.2 schema==0.6.7
          python website/prepare_lite.py
          jupyter lite build --lite-dir website/lite --contents lite-content --output-dir site-dist/lite
      - name: Verify repository and Site contract
        run: python tools/check_repository_contract.py
      - name: Build and verify local page links
        run: python website/build.py
      - name: Verify personalized learning service
        run: |
          node --check website/learning.js
          npm --prefix site-app test
          npm --prefix site-app run build
          test -f site-app-dist/client/index.html
          test -f site-app-dist/server/index.js
          test -f site-app-dist/.openai/drizzle/0000_fearless_stone_men.sql
      - uses: actions/upload-artifact@v4
        with:
          name: chinese-learning-site
          path: site-app-dist/
          retention-days: 30
