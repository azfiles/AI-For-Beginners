name: Transfer learning fine-tuning regression
on:
  push:
    paths: ['lessons/4-ComputerVision/08-TransferLearning/TransferLearningTF.ipynb', '.github/workflows/transfer-finetuning.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer_tf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            lessons
            site
            tools
            data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install torch==2.2.2 torchvision==0.17.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r site/requirements-advanced.txt
      - run: python tools/test_long_notebooks.py transfer_tf
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          TF_NUM_INTEROP_THREADS: '1'
          TF_NUM_INTRAOP_THREADS: '1'
          MPLBACKEND: Agg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transfer-finetuning-result
          path: compatibility-results/
